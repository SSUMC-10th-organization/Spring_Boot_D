<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 40px 36px;
            width: 360px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.1);
        }
        h2 { font-size: 22px; margin-bottom: 28px; color: #111; text-align: center; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 18px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus { border-color: #f7a800; }
        button {
            width: 100%;
            padding: 12px;
            background: #f7a800;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #e09900; }
        #error-msg {
            color: #e53e3e;
            font-size: 13px;
            margin-bottom: 14px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>로그인</h2>
    <p id="error-msg">이메일 또는 비밀번호가 올바르지 않습니다.</p>
    <form id="loginForm">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="이메일을 입력하세요" required>
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
        <button type="submit">로그인</button>
    </form>
</div>
<script>
    // URL에 error 파라미터가 있으면 에러 메시지 표시
    if (new URLSearchParams(location.search).has('error')) {
        document.getElementById('error-msg').style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const params = new URLSearchParams();
        params.append('email', document.getElementById('email').value);
        params.append('password', document.getElementById('password').value);

        const res = await fetch('/api/members/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        });

        const data = await res.json();
        if (data.success) {
            alert('로그인 성공: ' + data.result.name);
            location.href = '/swagger-ui/index.html';
        } else {
            document.getElementById('error-msg').style.display = 'block';
        }
    });
</script>
</body>
</html>
